<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo Negro Profundo -->
  <rect width="512" height="512" rx="100" fill="#050505" />
  
  <!-- Cuadrícula de Osciloscopio -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#39FF14" stroke-width="1" opacity="0.15" />
    </pattern>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#grid)" />
  
  <!-- Diapasón Vostok -->
  <g transform="translate(128, 128) scale(10.6)">
    <path d="M12 22v-8" stroke="#39FF14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M8 14V4" stroke="#39FF14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M16 14V4" stroke="#39FF14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M8 14c0 2.2 1.8 4 4 4s4-1.8 4-4" stroke="#39FF14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
  
  <!-- Brillo Perimetral -->
  <rect width="512" height="512" rx="100" fill="none" stroke="#39FF14" stroke-width="4" opacity="0.1" />
</svg>